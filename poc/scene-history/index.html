<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LociView isolated storage probe</title>
<body>
  <h1>隔離・保存検証</h1>
  <p>合成データのみ。本番UI・実機・オフライン合格の証拠ではありません。</p>
  <button id="create">保存・失敗・再試行を検証</button>
  <button id="pause">統合の途中で停止</button>
  <button id="observe">保存状態を確認</button>
  <button id="attempt">未完了時の操作拒否を検証</button>
  <button id="recover">元の変更データから復旧</button>
  <a href="/" target="_blank" rel="noopener">同じ検証を別タブで開く</a>
  <p id="state" role="status">読込中</p>
  <pre id="result" aria-live="polite"></pre>
  <script type="module" src="/browser.mjs"></script>
</body>
</html>
