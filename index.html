<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LociView Dev Harness</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0f1115; color: #cbd5e1; font: 14px/1.5 system-ui, sans-serif; height: 100vh; display: flex; }
    #stage { flex: 1; position: relative; min-width: 0; }
    #gl { width: 100%; height: 100%; display: block; }
    #panel { width: 340px; border-left: 1px solid #1f2937; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    h1 { font-size: 14px; margin: 0; }
    .warn { color: #fbbf24; font-size: 11px; }
    .grp { border: 1px solid #1f2937; border-radius: 8px; padding: 8px; }
    .grp h2 { font-size: 12px; margin: 0 0 6px; opacity: .8; }
    button, input, select { background: #111827; border: 1px solid #1f2937; color: #cbd5e1; border-radius: 6px; padding: 5px 8px; font: inherit; }
    button { cursor: pointer; }
    button.active { background: #2563eb; border-color: #3b82f6; color: #fff; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    #pin-list { max-height: 180px; overflow-y: auto; font-size: 12px; }
    #pin-list div { padding: 3px 6px; border-radius: 4px; cursor: pointer; }
    #pin-list div.sel { background: rgba(59, 130, 246, .3); }
    #stats, #log { font-size: 11px; opacity: .8; white-space: pre-wrap; word-break: break-all; }
    #log { max-height: 140px; overflow-y: auto; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="gl"></canvas></div>
  <aside id="panel">
    <h1>LociView Dev Harness</h1>
    <div class="warn">開発検証用ページ。製品UIは別途デザイン（docs/05）に基づき実装されます。</div>

    <div class="grp">
      <h2>モデル読込</h2>
      <div class="row">
        <input type="file" id="file-model" accept=".glb,.gltf,.obj,.stl,.ply" style="max-width:100%" />
      </div>
      <div class="row" style="margin-top:6px">
        <button data-sample="cube.stl">STL</button>
        <button data-sample="cube.obj">OBJ</button>
        <button data-sample="points.ply">PLY点群</button>
        <button data-sample="tri.glb">GLB</button>
      </div>
      <div id="stats"></div>
    </div>

    <div class="grp">
      <h2>ピン（Shift+Click / モードON中はクリック）</h2>
      <div class="row">
        <button id="btn-pinmode">ピン追加モード: OFF</button>
        <input type="color" id="pin-color" value="#eab308" />
      </div>
      <div id="pin-list"></div>
    </div>

    <div class="grp">
      <h2>プロジェクト（データ層スモーク）</h2>
      <div class="row">
        <button id="btn-export">ZIP書き出し</button>
        <label><input type="file" id="file-import" accept=".zip,.lociview" style="display:none" /><button id="btn-import">ZIP取込/マージ</button></label>
      </div>
    </div>

    <div class="grp">
      <h2>表示</h2>
      <div class="row">
        背景 <input type="color" id="bg-color" value="#0b0d11" />
        <button id="btn-fit">全体表示</button>
      </div>
    </div>

    <div class="grp">
      <h2>ログ</h2>
      <div id="log"></div>
    </div>
  </aside>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
