let captions=structuredClone(initialCaptions),s,opener=null,toastTimer,helpTimer,helpExitTimer,helpAnchor=null,heldSheet=null,sheetDirty=false;

reset();

function drawModel(){
 const iso=(x,y,z)=>[285+(x-y)*1.02,405+(x+y)*.42-z*.98],points=a=>a.map(v=>iso(...v).join(',')).join(' ');
 const box=(x,y,z,w,d,h,colors)=>{const a=[x,y,z],b=[x+w,y,z],c=[x+w,y+d,z],e=[x,y+d,z];return `<polygon points="${points([e,c,[x+w,y+d,z+h],[x,y+d,z+h]])}" fill="${colors[0]}"/><polygon points="${points([b,c,[x+w,y+d,z+h],[x+w,y,z+h]])}" fill="${colors[1]}"/><polygon points="${points([[x,y,z+h],[x+w,y,z+h],[x+w,y+d,z+h],[x,y+d,z+h]])}" fill="${colors[2]}"/>`;};

function currentOwner(){return s.sub==='model-placement'?'model-placement':s.sub==='placement'?'placement':s.sub==='material'?'material':s.tab==='captions'?'caption':s.tab;}

function render(){

function dirty(owner){if(!s.draft)s.draft={owner,id:s.id,title:captions[s.id]?.title||'',body:captions[s.id]?.body||''};s.dirty=true;renderFooter();updateGuards();}
function startPlace(){if(blocked())return;s.edit=true;s.tab='captions';s.detail=true;s.sub='placement';s.draft={owner:'placement',id:s.id};s.dirty=false;setMobile('stage');render();}
function choose(id){if(blocked())return;s.id=Number(id);s.compare=true;s.comparisonIds.add(s.id);s.detail=true;s.tab='captions';s.sub=null;render();setMobile('panel');}
function action(name,node){
 if(name==='open-project'){if(blocked())return;if($('sheet').open)closeSheet();s.start=true;render();return;}
 if(name==='open-source'){openSheet('conversion');return;}
 if(['resume-view','resume-edit','resume-failure','conversion-open'].includes(name)){if($('sheet').open)closeSheet();s.start=false;s.edit=name!=='resume-view';s.failure=name==='resume-failure';render();if(s.failure)openSheet('failure');return;}
 if(name==='close-sheet'){requestCloseSheet();return;}if(name==='keep-sheet'){restoreSheet();return;}if(name==='discard-sheet'){heldSheet=null;sheetDirty=false;closeSheet();return;}if(name==='return-edit'){s.tab=s.draft?.owner==='model-placement'?'models':s.draft?.owner==='material'?'materials':'captions';s.detail=true;if(s.draft?.owner==='model-placement')s.sub='model-placement';else if(s.draft?.owner==='placement')s.sub='placement';else if(s.draft?.owner==='material')s.sub='material';else s.sub=null;setMobile('panel');render();document.querySelector('[data-draft]')?.focus();return;}
 if(name==='focus-body'){document.querySelector('[data-draft="body"]')?.focus();return;}
 if(name==='mode'){if(blocked())return;s.edit=!s.edit;s.sub=null;render();return;}
 if(name==='select'){choose(node.dataset.id);return;}if(name==='list'){s.detail=false;s.tab='captions';render();return;}
 if(name==='previous'||name==='next'){if(!captions.length)return;choose((s.id+(name==='next'?1:captions.length-1))%captions.length);return;}
 if(name==='scene'){if(blocked())return;s.scene=node.dataset.scene;render();toast('シーンを切り替えました。');return;}
 if(name==='compare'){s.compare=true;s.comparisonIds.add(s.id);renderComparison();setMobile('stage');return;}
 if(name==='close-window'){const win=node.closest('.lv-window');s.comparisonIds.delete(Number(win.dataset.windowId));win.remove();drawConnections();return;}if(name==='end-compare'){s.compare=false;renderComparison();return;}
 if(name==='arrange'){const a=document.querySelector('.lv-window'),b=document.querySelector('.lv-window-second');if(a&&b){a.style.left='24px';a.style.top='140px';b.style.left=window.innerWidth<761?'70px':'300px';b.style.top=window.innerWidth<761?'330px':'140px';}drawConnections();return;}
 if(name==='place'){startPlace();return;}if(name==='place-model'){if(blocked())return;s.edit=true;s.tab='models';s.sub='model-placement';s.draft={owner:'model-placement',values:{}};render();setMobile('panel');return;}if(name==='model-list'){s.sub=null;render();return;}
 if(name==='new-pin'){if(blocked())return;if(!captions.length){captions=structuredClone(initialCaptions);s.id=0;}s.edit=true;startPlace();toast('モデル上の位置を選択してください。');return;}
 if(name==='visibility'){s.hiddenModel=!s.hiddenModel;render();return;}
 if(name==='material-edit'){if(blocked())return;s.sub='material';s.draft={owner:'material',id:s.id};render();return;}
 if(name==='cancel-edit'){if(s.dirty)openSheet('cancel');else{s.sub=null;s.draft=null;render();}return;}
 if(name==='discard'){s.draft=null;s.dirty=false;s.sub=null;closeSheet();render();return;}
 if(name==='apply'){if(!s.dirty||s.composing||s.busy)return;s.busy=true;renderFooter();updateGuards();setTimeout(()=>{if(s.draft?.owner==='caption'){captions[s.draft.id].title=s.draft.title;captions[s.draft.id].body=s.draft.body;}const placement=s.sub==='placement',modelPlacement=s.sub==='model-placement';if(s.draft?.owner!=='caption')s.applied[s.draft.owner]={...s.applied[s.draft.owner],...s.draft.values};s.busy=false;s.dirty=false;s.draft=null;s.sub=null;render();toast(placement?'ピンの位置を確定しました。':modelPlacement?'モデルの配置を確定しました。':'変更を適用しました。');},450);return;}
 if(name==='files'){if(blocked())return;openSheet(s.edit?'save':'files');return;}
 if(name==='save'){openSheet('save');return;}
 if(name==='share'){if(blocked())return;openSheet('share');return;}
 if(name==='axis'||name==='fit'){ $('camera-status').textContent=name==='fit'?'全体を表示':node.dataset.axis+'軸から表示';return;}
 if(name==='create-output'||name==='retry-output'||name==='restore-now'){
 s.busy=true;$('sheet-close').disabled=true;$('sheet-body').insertAdjacentHTML('beforeend','<p class="lv-busy" role="status">'+(name==='restore-now'?'復元しています…':'ファイルを作成しています…')+'</p>');$('sheet-footer').querySelectorAll('button').forEach(b=>b.disabled=true);setTimeout(()=>{s.busy=false;s.failure=false;$('sheet-close').disabled=false;updateGuards();if(name==='restore-now'){closeSheet();toast('バックアップの時点へ切り替えました。');}else openSheet('downloaded');},650);return;}
 if(name==='resolve'){if(s.conflictChoice===null)return;captions[s.id].body=s.conflictChoice==='0'?'北東側の角に欠損が見られる。再撮影する。':'柱頭の欠損は約3cm。接写を追加する。';closeSheet();render();toast('選んだ内容で確定しました。');return;}
 if(name==='received'){closeSheet();toast('更新を取り込みました。');return;}
 if(name==='view-created'){closeSheet();toast('視点を追加しました。');return;}
 if(name==='apply-background'){const color=document.querySelector('[data-action="background"]').value;s.background=color;document.getElementById('stage').style.background=color==='dark'?'#394b56':'';toast('背景を変更しました。');return;}if(name==='recall'){toast('保存した視点を表示しました。');return;}
 if(name==='set-entry'){toast('開始視点を設定しました。');return;}
 if(name==='settings-apply'){closeSheet();toast('設定を適用しました。');return;}
 if(name==='offline-ready'){closeSheet();toast('オフライン準備完了の表示例です。');return;}
 if(name==='delete-confirm'){const removed=s.id;captions.splice(removed,1);s.comparisonIds=new Set([...s.comparisonIds].filter(i=>i!==removed).map(i=>i>removed?i-1:i));s.id=0;s.detail=false;closeSheet();render();toast('キャプションを削除しました。');return;}
 if(name==='membership-confirm'){closeSheet();toast('このシーンから外しました。');return;}
 if(name==='media'){s.mediaId=node.dataset.mediaId===undefined?s.id:Number(node.dataset.mediaId);openSheet('media');return;}if(name==='download-example'){openSheet('downloaded');return;}
 if(name==='new-view'){if(blocked())return;openSheet('new-view');return;}
 if(['media','settings','offline','names','help','scenes','workspace','contribution','review','clean','restore','failure','add-media','add-model','alignment','replace-model','delete-model','pin-color','remove-membership','delete-caption','receive','verify-file','filters','open-project','rename-scene','add-scene'].includes(name)){if(!['media','help','settings','filters'].includes(name)&&s.dirty){warnDraft();return;}openSheet(name);}
}
document.addEventListener('click',e=>{const mobile=e.target.closest('button[data-mobile]');if(mobile){setMobile(mobile.dataset.mobile);return;}const tab=e.target.closest('[data-tab]');if(tab){if(s.busy||s.composing)return;s.tab=tab.dataset.tab;s.sub=s.draft?.owner==='material'&&s.tab==='materials'?'material':s.draft?.owner==='placement'&&s.tab==='captions'?'placement':s.draft?.owner==='model-placement'&&s.tab==='models'?'model-placement':null;render();setMobile('panel');return;}const node=e.target.closest('[data-action]');if(node&&!node.disabled)action(node.dataset.action,node);});
document.addEventListener('input',e=>{if(e.target.closest('#sheet')&&e.target.name!=='conflict')sheetDirty=true;if(e.target.classList.contains('lv-search')){s.query=e.target.value;renderList();return;}if(e.target.dataset.draft){dirty(currentOwner());s.draft.values??={};s.draft.values[e.target.dataset.draft]=e.target.value;if(e.target.dataset.draft==='title')s.draft.title=e.target.value;if(e.target.dataset.draft==='body')s.draft.body=e.target.value;}});
document.addEventListener('change',e=>{if(e.target.closest('#sheet')&&e.target.name!=='conflict')sheetDirty=true;if(e.target.dataset.draft&&s.draft?.values?.[e.target.dataset.draft]!==e.target.value){dirty(currentOwner());s.draft.values??={};s.draft.values[e.target.dataset.draft]=e.target.value;}if(e.target.name==='conflict'){s.conflictChoice=e.target.value;$('sheet-footer').querySelector('[data-action="resolve"]').disabled=false;}if(e.target.id==='material-scope'){s.materialScope=e.target.value;$('material-impact').textContent=e.target.value==='このシーンだけ'?'北回廊だけに反映します。':'シーン専用の設定がある場合は、そちらを優先します。';}if(e.target.dataset.action==='projection')toast(e.target.value+'に切り替えました。');});
document.addEventListener('compositionstart',e=>{if(e.target.matches('input,textarea')){s.composing=true;updateGuards();renderFooter();}});document.addEventListener('compositionend',()=>{s.composing=false;updateGuards();renderFooter();});
document.querySelector('.lv-tabs').addEventListener('keydown',e=>{const tabs=[...document.querySelectorAll('[data-tab]')],at=tabs.indexOf(e.target);if(at<0)return;let next;if(e.key==='ArrowRight')next=(at+1)%4;if(e.key==='ArrowLeft')next=(at+3)%4;if(e.key==='Home')next=0;if(e.key==='End')next=3;if(next!==undefined){e.preventDefault();tabs[next].focus();tabs[next].click();}});

$('sheet').addEventListener('cancel',e=>{e.preventDefault();if(!s.busy)requestCloseSheet();});
function hideHelp(){clearTimeout(helpTimer);clearTimeout(helpExitTimer);$('tooltip').hidden=true;if(helpAnchor)helpAnchor.removeAttribute('aria-describedby');helpAnchor=null;}
function showHelp(node){if(!node.isConnected)return;clearTimeout(helpExitTimer);helpAnchor=node;$('tooltip').textContent=node.dataset.help;$('tooltip').hidden=false;node.setAttribute('aria-describedby','tooltip');const r=node.getBoundingClientRect(),t=$('tooltip').getBoundingClientRect();$('tooltip').style.left=Math.max(10,Math.min(innerWidth-t.width-10,r.left))+'px';const above=r.bottom+8+t.height>innerHeight-10;$('tooltip').dataset.placement=above?'above':'below';$('tooltip').style.top=Math.max(10,above?r.top-t.height-8:r.bottom+8)+'px';}
document.addEventListener('pointerover',e=>{const n=e.target.closest('[data-help]');if(n&&!n.contains(e.relatedTarget)){hideHelp();helpTimer=setTimeout(()=>showHelp(n),2000);}});document.addEventListener('pointerout',e=>{const n=e.target.closest('[data-help]');if(n&&!n.contains(e.relatedTarget)&&!$('tooltip').contains(e.relatedTarget)){clearTimeout(helpExitTimer);helpExitTimer=setTimeout(hideHelp,300);}});$('tooltip').addEventListener('pointerenter',()=>clearTimeout(helpExitTimer));$('tooltip').addEventListener('pointerleave',()=>{helpExitTimer=setTimeout(hideHelp,300);});document.addEventListener('focusin',e=>{const n=e.target.closest('[data-help]');if(n){hideHelp();showHelp(n);}});document.addEventListener('focusout',e=>{if(e.target.closest('[data-help]'))hideHelp();});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('tooltip').hidden){e.preventDefault();e.stopPropagation();hideHelp();}},true);
$('scenario').addEventListener('change',e=>{if($('sheet').open)$('sheet').close();hideHelp();reset();captions=structuredClone(initialCaptions);const v=e.target.value;s.start=v==='start';s.edit=!['view','compare'].includes(v);s.tab=['models','views','materials'].includes(v)?v:'captions';if(v==='list')s.detail=false;if(v==='place'){s.sub='placement';s.draft={owner:'placement',id:0};s.dirty=true;}if(v==='edit'){s.draft={owner:'caption',id:0,title:captions[0].title,body:captions[0].body};s.dirty=false;}if(v==='compare'){s.compare=true;s.comparisonIds=new Set([0,1]);}if(v==='empty')captions=[];if(v==='failure')s.failure=true;render();setMobile(['edit','list','materials','models','views'].includes(v)?'panel':'stage');if(['save','share','conflict','restore','failure'].includes(v))openSheet(v);});
